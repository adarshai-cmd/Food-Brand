<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 400" fill="none">
  <!-- Soft Drop Shadow -->
  <ellipse cx="110" cy="385" rx="75" ry="12" fill="#111111" opacity="0.25"/>

  <!-- Can Group -->
  <g stroke="#111111" stroke-linejoin="round">
    <!-- Top Rim (Aluminum) -->
    <path d="M 68 28 C 68 22, 152 22, 152 28 L 158 40 C 158 45, 62 45, 62 40 Z" 
          fill="#FFF8EC" stroke-width="3"/>
    <!-- Pull Tab / Top Lid Ellipse -->
    <ellipse cx="110" cy="27" rx="42" ry="7" fill="#E8DEC8" stroke-width="2"/>
    <ellipse cx="110" cy="27" rx="14" ry="4" fill="#FFF8EC" stroke-width="2"/>
    <!-- Pull tab ring -->
    <path d="M 104 26 L 116 26 M 110 24 L 110 28" stroke="#111111" stroke-width="2"/>

    <!-- Neck Taper -->
    <path d="M 58 40 C 58 40, 162 40, 162 40 L 172 65 C 172 65, 48 65, 48 65 Z" 
          fill="#FF6B00" stroke-width="3"/>

    <!-- Main Can Body -->
    <rect x="46" y="65" width="128" height="280" rx="4" fill="#FF6B00" stroke-width="3.5"/>

    <!-- Can Bottom Taper & Base -->
    <path d="M 46 345 L 56 370 C 56 375, 164 375, 164 370 L 174 345 Z" 
          fill="#FFF8EC" stroke-width="3"/>
    <ellipse cx="110" cy="370" rx="54" ry="6" fill="#D9CEB6" stroke-width="2.5"/>
  </g>

  <!-- CAN LABEL DESIGN (Clipped inside body) -->
  <g clip-path="url(#can-clip-tangerine)">
    <defs>
      <clipPath id="can-clip-tangerine">
        <rect x="47" y="66" width="126" height="278" rx="3"/>
      </clipPath>
      <linearGradient id="tang-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#E05500"/>
        <stop offset="35%" stop-color="#FF6B00"/>
        <stop offset="70%" stop-color="#FF8533"/>
        <stop offset="100%" stop-color="#D44D00"/>
      </linearGradient>
    </defs>

    <!-- Base Gradient -->
    <rect x="47" y="66" width="126" height="278" fill="url(#tang-grad)"/>

    <!-- Left/Right Can 3D Sheen -->
    <rect x="47" y="66" width="18" height="278" fill="#111111" opacity="0.08"/>
    <rect x="80" y="66" width="14" height="278" fill="#FFFFFF" opacity="0.25"/>
    <rect x="156" y="66" width="17" height="278" fill="#111111" opacity="0.12"/>

    <!-- Playful Pattern & Doodles on Can -->
    <!-- Giant Sunshine Disc -->
    <circle cx="110" cy="185" r="52" fill="#FFE14D" stroke="#111111" stroke-width="3"/>

    <!-- Hand-drawn Citrus Slice in Center -->
    <g transform="translate(110, 185) scale(0.68) translate(-60, -60)">
      <circle cx="60" cy="60" r="48" fill="#FF6B00" stroke="#111111" stroke-width="4"/>
      <circle cx="60" cy="60" r="41" fill="#FFF8EC" stroke="#111111" stroke-width="3"/>
      <circle cx="60" cy="60" r="36" fill="#FFE14D"/>
      <!-- Segments -->
      <path d="M 64 54 L 84 42 A 30 30 0 0 0 72 30 L 64 54 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <path d="M 56 54 L 48 30 A 30 30 0 0 0 36 42 L 56 54 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <path d="M 54 58 L 28 52 A 30 30 0 0 0 28 68 L 54 62 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <path d="M 56 66 L 36 78 A 30 30 0 0 0 48 90 L 56 66 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <path d="M 64 66 L 72 90 A 30 30 0 0 0 84 78 L 64 66 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <path d="M 66 62 L 92 68 A 30 30 0 0 0 92 52 L 66 58 Z" fill="#FF6B00" stroke="#111111" stroke-width="2.5"/>
      <circle cx="60" cy="60" r="4" fill="#FFF8EC" stroke="#111111" stroke-width="2"/>
    </g>

    <!-- Top Label Header: Brand Wordmark -->
    <rect x="58" y="80" width="104" height="26" rx="6" fill="#FFF8EC" stroke="#111111" stroke-width="2.5"/>
    <text x="110" y="98" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">ZESTPOP</text>

    <!-- Flavor Name -->
    <text x="110" y="123" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="12" fill="#FFF8EC" text-anchor="middle" letter-spacing="0.5">ELECTRIC</text>
    <text x="110" y="138" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="15" fill="#FFE14D" text-anchor="middle" letter-spacing="1">TANGERINE</text>

    <!-- Flavor Subtext Badge -->
    <rect x="66" y="254" width="88" height="18" rx="9" fill="#111111"/>
    <text x="110" y="267" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8.5" fill="#FFF8EC" text-anchor="middle" letter-spacing="0.8">PREBIOTIC FIZZ</text>

    <!-- Specs at Bottom -->
    <text x="110" y="295" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8" fill="#FFF8EC" text-anchor="middle">35 CALS • 5g FIBER</text>
    <text x="110" y="310" font-family="'DM Sans', sans-serif" font-weight="800" font-size="7.5" fill="#FFE14D" text-anchor="middle" letter-spacing="1.5">12 FL OZ (355ML)</text>

    <!-- Doodles & Condensation Droplets -->
    <!-- Star top-right -->
    <path d="M 148 108 L 150 114 L 156 115 L 151 118 L 153 124 L 148 120 L 143 124 L 145 118 L 140 115 L 146 114 Z" fill="#FFE14D" stroke="#111111" stroke-width="1.5"/>
    <!-- Star bottom-left -->
    <path d="M 68 225 L 70 230 L 75 231 L 71 234 L 72 239 L 68 236 L 64 239 L 65 234 L 61 231 L 66 230 Z" fill="#FFF8EC" stroke="#111111" stroke-width="1.5"/>

    <!-- Fresh Condensation Drops -->
    <circle cx="56" cy="140" r="3" fill="#FFF8EC" opacity="0.7"/>
    <circle cx="59" cy="146" r="1.5" fill="#FFF8EC" opacity="0.6"/>
    <circle cx="160" cy="195" r="3" fill="#FFF8EC" opacity="0.7"/>
    <circle cx="162" cy="202" r="2" fill="#FFF8EC" opacity="0.6"/>
    <circle cx="62" cy="275" r="2.5" fill="#FFF8EC" opacity="0.7"/>
  </g>
</svg>
