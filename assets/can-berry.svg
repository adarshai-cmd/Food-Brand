<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 400" fill="none">
  <!-- Soft Drop Shadow -->
  <ellipse cx="110" cy="385" rx="75" ry="12" fill="#111111" opacity="0.25"/>

  <!-- Can Group -->
  <g stroke="#111111" stroke-linejoin="round">
    <!-- Top Rim (Aluminum) -->
    <path d="M 68 28 C 68 22, 152 22, 152 28 L 158 40 C 158 45, 62 45, 62 40 Z" 
          fill="#FFF8EC" stroke-width="3"/>
    <!-- Pull Tab / Top Lid Ellipse -->
    <ellipse cx="110" cy="27" rx="42" ry="7" fill="#E8DEC8" stroke-width="2"/>
    <ellipse cx="110" cy="27" rx="14" ry="4" fill="#FFF8EC" stroke-width="2"/>
    <path d="M 104 26 L 116 26 M 110 24 L 110 28" stroke="#111111" stroke-width="2"/>

    <!-- Neck Taper -->
    <path d="M 58 40 C 58 40, 162 40, 162 40 L 172 65 C 172 65, 48 65, 48 65 Z" 
          fill="#FF5FA2" stroke-width="3"/>

    <!-- Main Can Body -->
    <rect x="46" y="65" width="128" height="280" rx="4" fill="#FF5FA2" stroke-width="3.5"/>

    <!-- Can Bottom Taper & Base -->
    <path d="M 46 345 L 56 370 C 56 375, 164 375, 164 370 L 174 345 Z" 
          fill="#FFF8EC" stroke-width="3"/>
    <ellipse cx="110" cy="370" rx="54" ry="6" fill="#D9CEB6" stroke-width="2.5"/>
  </g>

  <!-- CAN LABEL DESIGN -->
  <g clip-path="url(#can-clip-berry)">
    <defs>
      <clipPath id="can-clip-berry">
        <rect x="47" y="66" width="126" height="278" rx="3"/>
      </clipPath>
      <linearGradient id="berry-grad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#E23E84"/>
        <stop offset="35%" stop-color="#FF5FA2"/>
        <stop offset="70%" stop-color="#FF7AB4"/>
        <stop offset="100%" stop-color="#D12972"/>
      </linearGradient>
    </defs>

    <!-- Base Gradient -->
    <rect x="47" y="66" width="126" height="278" fill="url(#berry-grad)"/>

    <!-- Can 3D Sheen -->
    <rect x="47" y="66" width="18" height="278" fill="#111111" opacity="0.08"/>
    <rect x="80" y="66" width="14" height="278" fill="#FFFFFF" opacity="0.25"/>
    <rect x="156" y="66" width="17" height="278" fill="#111111" opacity="0.12"/>

    <!-- Giant Tangerine Disc -->
    <circle cx="110" cy="185" r="50" fill="#FF6B00" stroke="#111111" stroke-width="3"/>

    <!-- Berry Doodle in Center -->
    <g transform="translate(110, 185) scale(0.7) translate(-50, -50)">
      <!-- Berry Heart Shape / Cluster -->
      <circle cx="40" cy="40" r="14" fill="#99146D" stroke="#111111" stroke-width="3"/>
      <circle cx="60" cy="40" r="14" fill="#B81D84" stroke="#111111" stroke-width="3"/>
      <circle cx="32" cy="58" r="13" fill="#D12972" stroke="#111111" stroke-width="3"/>
      <circle cx="50" cy="56" r="15" fill="#FFE14D" stroke="#111111" stroke-width="3"/>
      <circle cx="68" cy="58" r="13" fill="#B81D84" stroke="#111111" stroke-width="3"/>
      <circle cx="50" cy="74" r="12" fill="#99146D" stroke="#111111" stroke-width="3"/>
      <!-- Leaves on top -->
      <path d="M 50 25 C 44 14, 32 18, 38 28 C 42 22, 50 24, 50 25 Z" fill="#69D945" stroke="#111111" stroke-width="2"/>
      <path d="M 50 25 C 56 14, 68 18, 62 28 C 58 22, 50 24, 50 25 Z" fill="#69D945" stroke="#111111" stroke-width="2"/>
    </g>

    <!-- Top Label Header: Brand Wordmark -->
    <rect x="58" y="80" width="104" height="26" rx="6" fill="#FFF8EC" stroke="#111111" stroke-width="2.5"/>
    <text x="110" y="98" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">ZESTPOP</text>

    <!-- Flavor Name -->
    <text x="110" y="123" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="12" fill="#FFF8EC" text-anchor="middle" letter-spacing="0.5">WILD BERRY</text>
    <text x="110" y="139" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="16" fill="#FFE14D" text-anchor="middle" letter-spacing="1">BUBBLE</text>

    <!-- Flavor Subtext Badge -->
    <rect x="66" y="254" width="88" height="18" rx="9" fill="#111111"/>
    <text x="110" y="267" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8.5" fill="#FFF8EC" text-anchor="middle" letter-spacing="0.8">HIBISCUS POP</text>

    <!-- Specs at Bottom -->
    <text x="110" y="295" font-family="'DM Sans', sans-serif" font-weight="700" font-size="8" fill="#FFF8EC" text-anchor="middle">35 CALS • ANTIOXIDANTS</text>
    <text x="110" y="310" font-family="'DM Sans', sans-serif" font-weight="800" font-size="7.5" fill="#FFE14D" text-anchor="middle" letter-spacing="1.5">12 FL OZ (355ML)</text>

    <!-- Condensation Drops -->
    <circle cx="56" cy="150" r="3" fill="#FFF8EC" opacity="0.8"/>
    <circle cx="160" cy="170" r="2.5" fill="#FFF8EC" opacity="0.8"/>
    <circle cx="60" cy="285" r="2" fill="#FFF8EC" opacity="0.7"/>
  </g>
</svg>
